components:
  schemas:
    AttachFolderRequest:
      type: object
      properties:
        folder_id:
          type: string
          format: uuid
          description: ID of the folder to attach. All files in the folder become available as project context.
      required:
      - folder_id
    UpdateProjectRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: New project name (non-empty after trim)
          example: 'Vendor: Acme MSA (renamed)'
        description:
          type: string
          nullable: true
          description: New project description, or null to clear it
        custom_instructions:
          type: string
          nullable: true
          description: New custom instructions for chats in this project, or null to clear them
    AttachFileRequest:
      type: object
      properties:
        file_id:
          type: string
          format: uuid
          description: ID of an already-uploaded file to attach to the project
      required:
      - file_id
    CreateProjectRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: Project name (required, non-empty after trim)
          example: 'Vendor: Acme MSA'
        description:
          type: string
          nullable: true
          description: Optional project description
        custom_instructions:
          type: string
          nullable: true
          description: Optional custom instructions for chats in this project
        is_access_controlled:
          type: boolean
          description: When true (default), the project is visible only to the creator and explicitly granted users. When false, any member of the organization can see it.
      required:
      - name
    ProjectResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique project identifier
        name:
          type: string
          description: Project name
        description:
          type: string
          nullable: true
          description: Project description, or null if unset
        custom_instructions:
          type: string
          nullable: true
          description: Custom instructions injected into chats opened in this project
        is_access_controlled:
          type: boolean
          description: When true, only the creator and explicitly granted users can see the project. When false, any member of the organization can see it.
        my_access_level:
          type: string
          nullable: true
          enum:
          - read
          - write
          - admin
          - null
          description: 'Caller''s access level on this project: `admin` (creator or explicitly granted admin), `write`, `read`, or `null` if the caller has no recorded grant. `null` is also returned for org-scoped keys, which carry no user identity.'
        created_at:
          type: string
          description: ISO 8601 creation timestamp
        updated_at:
          type: string
          description: ISO 8601 last-update timestamp
      required:
      - id
      - name
      - description
      - custom_instructions
      - is_access_controlled
      - my_access_level
      - created_at
      - updated_at
    ProjectChat:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique chat identifier
        title:
          type: string
          nullable: true
          description: Chat title, or null if untitled
        summary:
          type: string
          nullable: true
          description: AI-generated summary of the chat, if any
        created_at:
          type: string
          description: ISO 8601 creation timestamp
        updated_at:
          type: string
          description: ISO 8601 last-update timestamp
      required:
      - id
      - title
      - summary
      - created_at
      - updated_at
    ProjectFolderListResponse:
      type: object
      properties:
        folders:
          type: array
          items:
            $ref: '#/components/schemas/ProjectFolder'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
      - folders
      - pagination
    ProjectFile:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique file identifier
        name:
          type: string
          description: Original filename
        size:
          type: number
          description: File size in bytes
        content_type:
          type: string
          description: MIME type of the file
        status:
          type: string
          enum:
          - extracting
          - embedding
          - ready
          - failed
          description: Current processing status
        folder_id:
          type: string
          nullable: true
          format: uuid
          description: Folder the file is stored in, or null
        created_at:
          type: string
          description: ISO 8601 creation timestamp
      required:
      - id
      - name
      - size
      - content_type
      - status
      - folder_id
      - created_at
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
        code:
          type: string
          description: Machine-readable error code present on some errors (e.g. `RATE_LIMITED`, `INSUFFICIENT_CREDITS`, `TRIAL_NOT_STARTED`, `BILLING_NOT_CONFIGURED`). Branch on this rather than the human-readable `error` string.
        message:
          type: string
          description: Additional error details
        details:
          type: object
          additionalProperties:
            nullable: true
          description: Validation error details (for 400 errors)
      required:
      - error
    Pagination:
      type: object
      properties:
        limit:
          type: number
          description: Page size
        offset:
          type: number
          description: Current offset
        has_more:
          type: boolean
          description: Whether more results exist
      required:
      - limit
      - offset
      - has_more
    ProjectListResponse:
      type: object
      properties:
        projects:
          type: array
          items:
            $ref: '#/components/schemas/ProjectResponse'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
      - projects
      - pagination
    ProjectChatListResponse:
      type: object
      properties:
        chats:
          type: array
          items:
            $ref: '#/components/schemas/ProjectChat'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
      - chats
      - pagination
    ProjectFileListResponse:
      type: object
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/ProjectFile'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
      - files
      - pagination
    ProjectFolder:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique folder identifier
        name:
          type: string
          description: Folder name
        description:
          type: string
          nullable: true
          description: Folder description, or null if unset
        folder_type:
          type: string
          description: Folder type (custom, my-files, etc.)
      required:
      - id
      - name
      - description
      - folder_type
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'API key for authentication. Format: `gcai_xxxxxxxxx`


        Create API keys in the GC AI app under Settings → API.'
