notes: >-
  GC AI runs a hosted, OAuth-protected MCP server. The MCP endpoint returns 401
  without a bearer token; authorization is via the OAuth 2.1 authorization
  server advertised at /.well-known/oauth-authorization-server (authorization_code
  + refresh_token, PKCE S256, dynamic client registration). The tools[] list
  below is a candidate surface derived from the External API operations — the
  live tool names exposed by the server were not enumerable without credentials.
server:
  name: gc-ai
  transport: http
  url: https://app.gc.ai/api/mcp
  sse_url: https://app.gc.ai/api/mcp/sse
  auth:
    type: oauth2
    protected_resource_metadata: https://app.gc.ai/.well-known/oauth-protected-resource
    authorization_server_metadata: https://app.gc.ai/.well-known/oauth-authorization-server
    issuer: https://auth.gc.ai
    authorization_endpoint: https://auth.gc.ai/oauth2/authorize
    token_endpoint: https://app.gc.ai/api/mcp/oauth/token
    registration_endpoint: https://app.gc.ai/api/mcp/oauth/register
    grant_types: [authorization_code, refresh_token]
    pkce: S256
