aid: gc-ai
name: GC AI
description: >-
  GC AI is the AI platform for in-house legal teams, built by three-time General
  Counsel Cecilia Ziniti. It helps corporate counsel draft and review contracts,
  run reusable review Playbooks, conduct grounded legal research across 13M+ US
  court opinions, and work directly inside Microsoft Word. The GC AI External API
  (v1) gives programmatic access to chat completions, files, folders, projects,
  playbooks, and skills for workflow automation (Zapier, Make, n8n, or custom
  apps), and GC AI also operates an OAuth-protected Model Context Protocol (MCP)
  server. The platform is SOC 2 Type II, SOC 3, and GDPR compliant, with zero
  data-retention agreements with its model providers.
